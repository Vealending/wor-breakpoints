<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WoR Breakpoints</title>
<link rel="icon" href="img/favicon.png" type="image/png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.6.0/echarts.min.js"></script>
<style>
  /* One deliberate look: the game's dark, gold-trimmed battle UI. Painted explicitly, no theme switch. */
  :root{
    color-scheme:dark;
    --bg:#12151d; --panel:#20242f; --panel2:#2a2f3c; --panel3:#353b4a;
    --ink:#ece7db; --ink2:#c8c4ba; --muted:#959bab; --faint:#5f6576;
    --line:#3c4353; --grid:#2c3140; --ghost:#5a627a;
    --gold:#f0c25a; --gold2:#a3833d; --cream:#efe6d2; --rage:#ff8b3a; --rage2:#c85f1c; --spd:#5aa7ff; --mark:#f6f2e8;
    --warn:#e0b060; --warn-bg:#2b2a1e; --focus:#f0c25a;
  }
  *{box-sizing:border-box}
  ::selection{background:rgba(240,194,90,.35);color:var(--ink)}
  ::-webkit-scrollbar{width:10px;height:10px} ::-webkit-scrollbar-track{background:var(--panel2)} ::-webkit-scrollbar-thumb{background:#4a5163;border:2px solid var(--panel2);border-radius:6px} ::-webkit-scrollbar-thumb:hover{background:var(--gold2)}
  html{scrollbar-color:#4a5163 var(--panel2)}
  input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
  html,body{overflow-x:hidden}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;
    background-image:linear-gradient(180deg,rgba(18,21,29,.55) 0%,rgba(18,21,29,.82) 45%,var(--bg) 100%),var(--pagebg,none);background-repeat:no-repeat;background-size:100% auto,100% auto;background-position:top center;background-attachment:scroll}
  .wrap{max-width:960px;margin:0 auto;padding:22px 20px 44px;display:grid;gap:16px}
  .wrap>*{min-width:0}
  .site{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px;margin:0 2px -4px}
  .brand{font:700 1.05rem/1.2 "Cinzel",serif;letter-spacing:.08em;text-transform:uppercase;color:var(--cream)}
  .tag{font-size:.85rem;color:var(--muted)}
  .card{background:linear-gradient(180deg,rgba(32,36,47,.94),rgba(27,31,41,.97)),var(--cardbg,none);background-size:auto,cover;background-position:center;border:1px solid var(--line);border-radius:10px;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .card::before{content:"";position:absolute;inset:0;border-radius:10px;pointer-events:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
  h2{font:600 .95rem/1 "Cinzel",serif;letter-spacing:.06em;text-transform:uppercase;color:var(--cream);margin:0;display:flex;align-items:center;height:30px;padding:0 14px 3px 12px;margin-left:-12px;background-image:var(--title,none);background-repeat:no-repeat;background-size:auto 34px;background-position:left -2px;border-radius:3px}
  select,input,button{font-family:inherit}
  select:focus-visible,input:focus-visible,button:focus-visible,summary:focus-visible,.q:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

  /* ---- hero header ---- */
  .hero{display:grid;grid-template-columns:296px minmax(0,1fr) 260px;grid-template-rows:132px auto}
  .bust{grid-row:1;grid-column:1;border-top-left-radius:10px;overflow:hidden;background-size:296px 132px;background-repeat:no-repeat;background-position:left top;
    -webkit-mask-image:linear-gradient(90deg,#000 55%,transparent 100%);mask-image:linear-gradient(90deg,#000 55%,transparent 100%)}
  .bust.none{background:radial-gradient(160px 100px at 30% 60%,var(--panel3),transparent)}
  .info{grid-row:1;grid-column:2;display:flex;flex-direction:column;justify-content:space-between;gap:8px;padding:16px 16px 16px 0;min-width:0}
  .name{font:700 1.7rem/1.1 "Cinzel",serif;letter-spacing:.02em;color:var(--cream);text-shadow:0 1px 0 rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ult{display:flex;align-items:center;gap:12px;min-width:0}
  .uicon{width:52px;height:52px;flex:none;background-size:100% 100%;display:flex;align-items:center;justify-content:center}
  .uicon img{width:42px;height:42px;display:block;border-radius:3px}
  .uicon.none{border:1px solid var(--gold2);border-radius:4px}
  .utxt{min-width:0}
  .uname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .usub{font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .usub b{color:var(--gold);font-weight:600}
  .pick{grid-row:1;grid-column:3;display:grid;align-content:end;padding:16px 16px 16px 0;min-width:0}
  .lab{font-size:.75rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
  .pick{position:relative}
  .hbtn{width:100%;height:52px;display:flex;align-items:center;gap:10px;padding:4px 10px 4px 4px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);color:var(--ink);font:600 1rem "IBM Plex Sans",sans-serif;cursor:pointer;text-align:left}
  .hbtn:hover{border-color:var(--gold)}
  .hbtn img{width:42px;height:42px;border-radius:4px;flex:none;background:var(--panel3)}
  .hbtn span:first-of-type{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .caret{width:0;height:0;border:5px solid transparent;border-top:6px solid var(--muted);margin-top:5px}
  .hpop{position:absolute;right:16px;top:calc(100% - 8px);z-index:30;width:min(600px,calc(100vw - 40px));background:var(--panel);border:1px solid var(--gold2);border-radius:8px;box-shadow:0 14px 40px rgba(0,0,0,.6);padding:10px}
  .hpop input{width:100%;height:38px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);color:var(--ink);font:500 .95rem "IBM Plex Sans",sans-serif;margin-bottom:10px}
  .hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;max-height:min(420px,55vh);overflow-y:auto;padding-right:2px}
  .hcard{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 2px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--ink2);cursor:pointer;font:500 .7rem/1.15 "IBM Plex Sans",sans-serif;text-align:center}
  .hcard img{width:56px;height:56px;border-radius:5px;background:var(--panel3);box-shadow:0 0 0 1px rgba(0,0,0,.6)}
  .hcard span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hcard:hover,.hcard.sel{border-color:var(--gold);background:var(--panel2);color:var(--ink)}
  .hcard.cur{background-image:var(--chosen,none);background-size:100% auto;background-position:center 0;background-repeat:no-repeat}
  .hcard.cur img{box-shadow:0 0 0 2px var(--gold)}
  @media (max-width:760px){.hpop{left:16px;right:16px;width:auto}}
  .rrrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .rrrow .lab{margin-bottom:0}
  .ic{display:inline-block;width:18px;height:18px;vertical-align:-4px;margin-right:4px;background-size:contain;background-repeat:no-repeat;background-position:center}
  .bubble .ic{width:16px;height:16px;align-self:center;margin-right:0}
  .num{width:4.2em;height:32px;padding:4px 8px;border:1px solid var(--gold2);border-radius:6px;background:var(--panel2);color:var(--ink);font:600 1rem "IBM Plex Sans",sans-serif;text-align:right;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
  .num::-webkit-outer-spin-button,.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .unit{color:var(--muted);font-size:.9rem;margin-right:4px}
  .steps{display:flex;gap:4px}
  .steps button{height:32px;min-width:58px;border:0;background:var(--taboff,var(--panel2));background-size:100% 100%;background-repeat:no-repeat;color:var(--ink);border-radius:4px;padding:0 10px;font:600 .8rem "IBM Plex Sans",sans-serif;cursor:pointer;font-variant-numeric:tabular-nums;text-shadow:0 1px 1px rgba(0,0,0,.8)}
  .steps button:hover{filter:brightness(1.15)}
  .steps button.on{filter:brightness(1.35) saturate(1.15) drop-shadow(0 0 1px var(--gold)) drop-shadow(0 0 4px rgba(240,194,90,.7));color:#fff}
  .pick select,.num{border-color:var(--line)}

  /* rage bar strip */
  .bar{grid-row:2;grid-column:1/-1;border-top:1px solid var(--line);padding:11px 16px 12px;display:grid;gap:4px}
  .barhd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px;font-size:.92rem;color:var(--ink2)}
  .barhd b{color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums}
  .track{position:relative;height:22px;border-radius:3px;background:linear-gradient(#16130f,#0a0907);box-shadow:inset 0 0 0 1px #000,0 0 0 1px var(--gold2);margin:2px 12px}
  .fill{position:absolute;inset:3px auto 3px 3px;width:0;border-radius:2px;background:linear-gradient(#ffb060,#f07a25 55%,#b8501a);background-size:100% 100%;box-shadow:0 0 10px rgba(255,139,58,.45);transition:width .25s}
  .fill.sprite{background-image:var(--barfill);background-size:100% 100%}
  .cover{display:none}
  .track{margin:2px 0}
  .bar.off .track{opacity:.35}
  .barft{display:flex;flex-wrap:wrap;gap:2px 18px;font-size:.9rem;color:var(--ink2)}
  .barft>span{white-space:nowrap}
  .barft b{font-weight:600;color:var(--gold);font-variant-numeric:tabular-nums}
  @media (max-width:860px){
    .hero{grid-template-columns:296px minmax(0,1fr);grid-template-rows:132px auto auto}
    .pick{grid-row:2;grid-column:1/-1;padding:12px 16px 14px;border-top:1px solid var(--line)}
    .bar{grid-row:3}
  }
  @media (max-width:760px){
    .hero{grid-template-columns:1fr;grid-template-rows:auto auto auto auto}
    .bust{grid-row:1;grid-column:1;height:112px;background-size:auto 112px;background-position:center top;-webkit-mask-image:linear-gradient(#000 50%,transparent);mask-image:linear-gradient(#000 50%,transparent)}
    .info{grid-row:2;grid-column:1;padding:0 16px 8px;margin-top:-28px}
    .pick{grid-row:3;grid-column:1;padding:12px 16px 14px}
    .bar{grid-row:4}
    .barft>span{white-space:normal}
  }

  /* hover help */
  .q{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--faint);color:var(--muted);font-size:.66rem;font-weight:600;line-height:1;margin-left:5px;vertical-align:1px;cursor:help;position:relative;background:transparent}
  .q.ic{border:0;color:transparent;background:var(--icq) center/contain no-repeat;opacity:.6;width:14px;height:14px;margin-left:4px}
  .q.ic:hover{opacity:1}
  .q::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);width:max-content;max-width:300px;background:#1c202b;color:var(--ink);font:400 .8rem/1.4 "IBM Plex Sans",sans-serif;text-transform:none;letter-spacing:0;font-weight:400;padding:10px 12px;border:10px solid transparent;border-image:var(--tip,none) 24 fill / 10px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .1s;z-index:20;white-space:normal;text-align:left;box-shadow:0 6px 20px rgba(0,0,0,.5)}
  .q:hover::after,.q:focus::after{opacity:1}

  /* chart card */
  .chart{padding:14px 18px 12px}
  .chd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;margin-bottom:4px}
  #chart{width:100%;height:380px}
  .xs{position:relative;height:46px}
  .xs input[type=range]{position:absolute;top:14px;height:26px;padding:0;margin:0;cursor:pointer;display:block;z-index:1;-webkit-appearance:none;appearance:none;background:transparent}
  .xs input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--spd) var(--p,0%),rgba(255,255,255,.12) var(--p,0%));box-shadow:0 0 0 1px rgba(0,0,0,.6)}
  .xs input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.12)}
  .xs input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--spd)}
  .xs input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6px;border-radius:2px;transform:rotate(45deg);background:linear-gradient(135deg,#fff0c2,var(--gold) 55%,#8a6a2a);border:1px solid #2a2418;box-shadow:0 0 0 1px rgba(0,0,0,.6),0 0 10px rgba(240,194,90,.55)}
  .xs input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:2px;transform:rotate(45deg);background:linear-gradient(135deg,#fff0c2,var(--gold) 55%,#8a6a2a);border:1px solid #2a2418;box-shadow:0 0 0 1px rgba(0,0,0,.6),0 0 10px rgba(240,194,90,.55)}
  .xcover{position:absolute;top:16px;height:22px;pointer-events:none;background-image:var(--covm);background-repeat:repeat-x;background-size:auto 22px;opacity:.9}
  .xcover::before,.xcover::after{content:"";position:absolute;top:0;width:85px;height:22px;background-size:85px 22px;background-repeat:no-repeat}
  .xcover::before{left:-30px;background-image:var(--covl)} .xcover::after{right:-30px;background-image:var(--covr)}
  .bubble{position:absolute;top:-6px;transform:translateX(-50%);display:flex;align-items:baseline;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 6px 1px 4px;font-size:.76rem;color:var(--muted);white-space:nowrap}
  .bubble input{width:3.4em;border:0;background:transparent;color:var(--ink);font:600 .95rem "IBM Plex Sans",sans-serif;text-align:right;padding:0;-moz-appearance:textfield;font-variant-numeric:tabular-nums}
  .bubble input::-webkit-outer-spin-button,.bubble input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

  /* breakpoints */
  .bps{padding:14px 18px 16px}
  .bps h2{margin-bottom:10px}
  .bplist{display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:inline-flex;align-items:baseline;gap:7px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);color:var(--ink);font:500 .9rem "IBM Plex Sans",sans-serif;cursor:pointer;font-variant-numeric:tabular-nums}
  .chip span{color:var(--muted);font-size:.78rem;font-weight:400}
  .chip:hover{border-color:var(--gold)}
  .chip.on{background:var(--spd);border-color:var(--spd);color:#fff}.chip.on span{color:rgba(255,255,255,.85)}
  .chip.past{opacity:.45}
  .chip.more{color:var(--gold);border-style:dashed;background:transparent}

  .notice{border-left:3px solid var(--warn);background:var(--warn-bg);border-radius:6px;padding:9px 14px;font-size:.9rem;display:grid;gap:5px}
  .notice:empty{display:none}
  .notice b{font-weight:600}

  details{font-size:.92rem;color:var(--ink2);min-width:0}
  summary{cursor:pointer;font-weight:600;color:var(--ink);list-style:none;display:flex;align-items:center;gap:8px}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"";width:0;height:0;border:5px solid transparent;border-left:7px solid var(--gold);transition:transform .15s}
  details[open] summary::before{transform:rotate(90deg)}
  details .body{display:grid;gap:12px;margin-top:12px}
  details ol{margin:0;padding-left:1.3em;display:grid;gap:8px}
  details code{font:400 .84rem ui-monospace,Consolas,monospace;color:var(--ink);background:var(--panel2);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
  details table{border-collapse:collapse;font-size:.88rem}
  details td{padding:3px 16px 3px 0;vertical-align:top}
  details td.n{font-family:ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums;color:var(--ink)}
  details p{margin:0;max-width:70ch}
  .foot{font-size:.82rem;color:var(--faint);margin:0;display:flex;align-items:center;white-space:nowrap}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

<div class="wrap">
  <header class="site"><span class="brand">WoR Breakpoints</span><span class="tag">ATK SPD breakpoints and rage timing for every Watcher of Realms hero</span></header>
  <section class="card hero" aria-label="Hero">
    <div class="bust" id="bust"></div>
    <div class="info">
      <div class="name" id="hname"></div>
      <div class="ult"><span class="uicon" id="uicon"><img id="uimg" alt=""></span><div class="utxt"><div class="uname" id="uname"></div><div class="usub" id="usub"></div></div></div>
    </div>
    <div class="pick"><div><div class="lab">Hero</div>
      <select id="hero" aria-label="Hero" hidden></select>
      <button type="button" class="hbtn" id="heroBtn" aria-haspopup="listbox" aria-expanded="false"><img id="hbImg" alt=""><span id="hbName"></span><span class="caret"></span></button>
      <div class="hpop" id="heroPop" hidden><input type="search" id="hq" placeholder="Type a hero name" autocomplete="off" aria-label="Search heroes"><div class="hgrid" id="hgrid" role="listbox"></div></div>
    </div></div>
    <div class="bar" id="bar">
      <div class="barhd" id="barhd"></div>
      <div class="barft" id="barft"></div>
    </div>
  </section>

  <section class="card chart">
    <div class="chd">
      <h2 id="c_title"><span></span><span class="q" tabindex="0" data-tip="One line per Rage Regen level; the orange one is yours. Click a line or its label to switch. Drag the slider or click the chart to set ATK SPD. Blue ticks on the axis are the attack-speed breakpoints.">?</span></h2>
      <div class="rrrow"><span class="lab lab-ic" style="margin:0 4px 0 0"><i class="ic" id="icRage"></i>Rage Regen</span><input type="number" class="num" id="v_rr" min="0" max="300" step="1" aria-label="Rage Regen percent"><span class="unit">%</span><div class="steps" id="rrsteps"></div></div>
    </div>
    <div id="chart" role="img" aria-label="Seconds to fill the rage bar across attack speed, one line per Rage Regen level"></div>
    <div class="xs" id="xs">
      <div class="xcover" id="xcover"></div>
      <input type="range" id="s_as" min="100" max="800" step="1" value="100" aria-label="ATK SPD">
      <div class="bubble" id="bubble"><i class="ic" id="icAs"></i><input type="number" id="v_as" min="100" max="800" step="1" aria-label="ATK SPD value"><span>ATK SPD</span></div>
    </div>
  </section>

  <div class="notice" id="notes"></div>

  <section class="card bps">
    <h2><span>ATK SPD breakpoints</span><span class="q" tabindex="0" data-tip="Attacks run on a 66 ms clock, so the attack interval only changes at these ATK SPD values. Anything in between changes nothing. The number is the attack interval you get from that value up to the next one.">?</span></h2>
    <div class="bplist" id="bplist"></div>
  </section>

  <details>
    <summary>How this is computed</summary>
    <div class="body" id="how"></div>
  </details>
  <p class="foot">Client&nbsp;<span id="bver"></span>, ultimates at max level<span class="q" tabindex="0" data-tip="Steady state from the client's own data and code. Rage from skills, gear procs and Rage Regen (Attacked) is not included, so heroes that get hit or have rage-feeding kits ult faster than shown.">?</span></p>
</div>

    const n=[];
    if(off(h)) n.push('<b>'+h.nm+' does not build rage from attacks or over time.</b> The ultimate is charged by the kit itself, so ATK SPD and Rage Regen do not change its timing.');
    if(h.fl.includes('noult')) n.push('<b>'+h.nm+' has no rage ultimate.</b> Only the attack interval matters here.');
    else if(h.fl.includes('oddult')) n.push('<b>'+h.nm+'\'s ultimate slot is a War Roar</b>, not a normal Super skill. The timing shown assumes it still casts when the bar fills.');
    if(h.fl.includes('fixed')) n.push('<b>Fixed attack clock.</b> '+h.nm+' attacks every '+h.ms+' ms no matter the ATK SPD. Only Rage Regen changes the ult timing.');
    if(h.fl.includes('nopassive')) n.push('<b>No passive rage.</b> '+h.nm+' only gains rage from attacking.');
    if(h.fl.includes('allytrig')) n.push('<b>'+h.nm+' does not attack on his own.</b> His attacks fire when a marked ally attacks, so the rage from attacks is a best case.');
    if(h.fl.includes('charges')) n.push('<b>Stores two ultimate charges.</b> The bar holds up to '+(h.xc+1)+' times the rage needed, and a cast keeps whatever is left above one bar.');
    if(h.dr){ const as=+sAs.value, v=Math.floor(Math.max(0,as-100)/h.dr.step)*h.dr.per; n.push('<b>'+h.ult.nm+' scales with ATK SPD:</b> +'+h.dr.per+'% DMG per bonus ATK SPD while it is active, so <b>+'+fmt(v,1)+'% DMG</b> at '+as+'. Per point since client '+DATA.build+', no longer in 100-point bands.'); }
    return n;
  }

  function render(){
    const h=cur, as=+sAs.value;
    if(document.activeElement!==vAs) vAs.value=as; if(document.activeElement!==vRr) vRr.value=rr;
    stepsBox.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.v===rr));
    const iv=ivMs(h,as), T=period(h,as,rr), lock=lockS(h), F=firstUlt(h,as,rr), fs=fillS(h,as,rr);
    const isUlt=!off(h)&&!noUlt(h);
    $('c_title').firstChild.textContent=isUlt?'Seconds to fill the rage bar':'Seconds between attacks';
    // rage bar strip
    const bar=$('bar');
    bar.classList.toggle('off',!isUlt);
    if(isUlt){
      $('barhd').innerHTML='<span>Rage bar fills in <b>'+fmt(fs,1)+' s</b> at '+as+' ATK SPD and '+rr+'% Rage Regen</span><span>'+fmt(rate(h,as,rr),1)+' rage per second</span>';
      const qFirst=Q('Deploys with '+h.ir.toLocaleString()+' of the '+h.ma.toLocaleString()+' rage the ultimate needs.');
      const qThen=lock?Q('Bar-fill time plus the ultimate\'s own '+fmt(lock,0)+' s. The cast resets rage to 0, and the hero\'s own attacks and passive regen are paused for the duration. Rage from other sources, like allies\' skills, still counts.'):Q('The cast resets rage to 0 and regen resumes on the next frame; this ultimate has no duration.');
      $('barft').innerHTML='<span>First ult '+(F<=0.05?'ready on deploy':'<b>'+fmt(F,1)+' s</b> after deploy')+qFirst+', then every <span style="white-space:nowrap"><b>'+fmt(T,1)+' s</b>'+qThen+'</span>.</span><span>Attacks every <b>'+(iv/1000).toFixed(2)+' s</b> for <b>'+fmt(perAtk(h,as,rr),1)+'</b> rage each.</span>';
    } else {
      $('barhd').innerHTML='<span>'+(off(h)?'The ultimate is charged by the kit, not by the rage bar.':'No rage ultimate.')+'</span>';
      $('barft').innerHTML='<span>Attacks every <b>'+(iv/1000).toFixed(2)+' s</b>'+(off(h)?'':' for <b>'+fmt(perAtk(h,as,rr),1)+'</b> rage each')+'.</span>';
    }
    $('notes').innerHTML=notesFor(h).map(t=>'<div>'+t+'</div>').join('');
    if(!showAll&&bps.length>40&&!document.querySelector('.chip[data-a="'+([...bps].filter(b=>b.a<=as).map(b=>b.a).pop())+'"]')) buildChips();
    markChips();
    drawChart(h,as,isUlt);
    drawHow(h,as,isUlt);
    writeHash();
  }

  // ---- chart (ECharts) ----
  const chart=echarts.init($('chart'),null,{renderer:'svg'});
  const GRID={left:56,right:54,top:16,bottom:34};
  function drawChart(h,as,isUlt){
    const muted=cssv('--muted'),grid=cssv('--grid'),line=cssv('--line'),rage=cssv('--rage'),spd=cssv('--spd'),mark=cssv('--mark'),ghost=cssv('--ghost'),panel=cssv('--panel'),ink=cssv('--ink');
    const f=isUlt?((a,r)=>fillS(h,a,r)):((a)=>ivMs(h,a)/1000), color=isUlt?rage:spd;
    const levels=isUlt?[...new Set([...RR_LINES,rr])].sort((a,b)=>a-b):[rr];
    const pts=r=>{const o=[]; for(let a=100;a<=XCAP;a++) o.push([a,+f(a,r).toFixed(4)]); return o;};
    let lo=Infinity,hi=0; const data={}; for(const r of levels){ data[r]=pts(r); for(const p of data[r]){lo=Math.min(lo,p[1]);hi=Math.max(hi,p[1]);} }
    const span=Math.max(hi-lo,hi*0.12,0.2); const nice=v=>{const p=Math.pow(10,Math.floor(Math.log10(v)));const m=v/p;return (m<=1?1:m<=2?2:m<=5?5:10)*p;};
    const step=nice(span/5), y0=Math.max(0,Math.floor((lo-span*0.08)/step)*step), y1=Math.ceil((hi+span*0.08)/step)*step;
    const series=[];
    const yEnd=r=>data[r][data[r].length-1][1], near=(y1-y0)*0.045;
    for(const r of levels){ if(r===rr)continue; const clash=Math.abs(yEnd(r)-yEnd(rr))<near; series.push({type:'line',name:String(r),data:data[r],showSymbol:false,lineStyle:{color:ghost,width:1.2},step:isUlt?false:'end',z:1,triggerLineEvent:true,cursor:'pointer',
      endLabel:{show:!clash,formatter:r+'%',color:muted,fontSize:11,offset:[4,0]},emphasis:{lineStyle:{color:muted,width:1.6}}}); }
    const main={type:'line',name:String(rr),data:data[rr],showSymbol:false,lineStyle:{color,width:2.4},step:isUlt?false:'end',z:3,silent:true,
      endLabel:isUlt?{show:true,formatter:rr+'%',color,fontSize:11,fontWeight:600,offset:[4,0]}:{show:false},emphasis:{disabled:true},
      markPoint:{silent:true,data:[]},markLine:{silent:true,symbol:'none',lineStyle:{color:mark,opacity:.45,width:1,type:'solid'},label:{show:false},data:[{xAxis:as}]}};
    const mp=[{coord:[as,+f(as,rr).toFixed(4)],symbol:'circle',symbolSize:12,itemStyle:{color:mark,borderColor:panel,borderWidth:2},label:{show:false}}];
    if(isUlt&&h.bs>0){ const pk=peakOf(h,rr); if(pk<XCAP&&Math.abs(pk-as)>8) mp.unshift({coord:[pk,+f(pk,rr).toFixed(4)],symbol:'circle',symbolSize:8,itemStyle:{color,borderColor:panel,borderWidth:2},label:{show:true,formatter:'fastest at '+pk,position:'bottom',distance:8,color,fontSize:11,fontWeight:500}}); }
    main.markPoint.data=mp; series.push(main);
    series.push({type:'scatter',name:'bp',data:bps.map(b=>[b.a,y0]),symbol:'rect',symbolSize:[1.5,7],symbolOffset:[0,4],itemStyle:{color:spd},silent:true,z:2,tooltip:{show:false}});
    chart.setOption({
      animation:false,backgroundColor:'transparent',grid:GRID,
      xAxis:{type:'value',min:100,max:XCAP,interval:100,axisLine:{lineStyle:{color:line}},axisTick:{show:false},splitLine:{show:false},axisLabel:{color:muted,fontSize:11,fontFamily:'IBM Plex Sans'},z:2},
      yAxis:{type:'value',min:y0,max:y1,interval:step,axisLine:{show:false},axisTick:{show:false},splitLine:{lineStyle:{color:grid}},axisLabel:{color:muted,fontSize:11,fontFamily:'IBM Plex Sans',formatter:v=>fmt(v,step<1?1:0)+' s'}},
      tooltip:{trigger:'axis',axisPointer:{type:'line',lineStyle:{color:muted,width:1},label:{show:false}},backgroundColor:'rgba(28,32,43,.96)',borderColor:'#a3833d',borderWidth:1,textStyle:{color:'#ece7db',fontSize:12,fontFamily:'IBM Plex Sans'},padding:[8,11],transitionDuration:0,extraCssText:'box-shadow:0 8px 24px rgba(0,0,0,.5);border-radius:6px',
        formatter:ps=>{ const a=Math.round(ps[0].axisValue); const rows=['<b>ATK SPD '+a+'</b>','attack every '+(ivMs(h,a)/1000).toFixed(2)+' s'];
          if(!off(h)) rows.push(fmt(perAtk(h,a,rr),1)+' rage per attack, '+fmt(rate(h,a,rr),1)+' per second');
          if(isUlt) rows.push('bar full in '+fmt(fillS(h,a,rr),1)+' s at '+rr+'% Rage Regen'); return rows.join('<br>'); }},
      series
    },true);
    const w=$('chart').clientWidth, pw=Math.max(120,w-GRID.left-GRID.right);
    sAs.style.left=GRID.left+'px'; sAs.style.width=pw+'px'; sAs.style.setProperty('--p',((as-100)/(XCAP-100)*100).toFixed(2)+'%'); const xc=$('xcover'); xc.style.left=(GRID.left+8)+'px'; xc.style.width=(pw-16)+'px';
    const thumb=GRID.left+8+(as-100)/(XCAP-100)*(pw-16); $('bubble').style.left=Math.max(GRID.left+40,Math.min(GRID.left+pw-40,thumb))+'px';
  }
  let lineClickAt=0;
  chart.on('click',p=>{ if(p.componentType==='series'&&p.seriesType==='line'&&p.seriesName!==String(rr)){ lineClickAt=Date.now(); setRR(+p.seriesName); } });
  chart.getZr().on('click',e=>{ const p=chart.convertFromPixel({seriesIndex:0},[e.offsetX,e.offsetY]); if(!p||!isFinite(p[0]))return;
    setTimeout(()=>{ if(Date.now()-lineClickAt<150)return; sAs.value=Math.round(Math.max(100,Math.min(XCAP,p[0]))); render(); },0); });
  window.addEventListener('resize',()=>{chart.resize(); render();});

  function drawHow(h,as,isUlt){
    const cd=cdMs(h,as), fr=frames(cd), iv=fr*FRAME, R=(1+rr/100).toFixed(2), pab=perAtkBase(h,as), rg=rate(h,as,rr), lock=lockS(h);
    const li=[];
    li.push('<li>Attack cooldown: <code>'+(h.bs>0?'MinSpeed + BaseSpeed × 200 ÷ (100 + ATK SPD) = '+h.ms+' + '+h.bs+' × 200 ÷ '+(100+as)+' = '+cd.toLocaleString()+' ms':'MinSpeed = '+cd+' ms (BaseSpeed is 0, so ATK SPD is ignored)')+'</code>, rounded up to whole '+FRAME+' ms frames: '+fr+' frames = <code>'+iv.toLocaleString()+' ms</code>. That rounding is why only certain ATK SPD values matter.</li>');
    if(!off(h)){
      li.push('<li>Rage Regen (Auto): <code>AngerRecovery ÷ 15 per frame = '+h.ar+' ÷ 15 × 15.15 = '+fmt(passive(h),2)+' per second</code>. The Rage Regen stat does not scale this part.</li>');
      li.push('<li>Rage Regen (Basic ATK): <code>'+(h.hg?'(1 + Rage Regen) × max(0.3 × '+h.naa+', '+h.naa+' − (ATK SPD − 100) ÷ '+h.hg+') = '+R+' × '+fmt(pab,2):'(1 + Rage Regen) × '+h.naa+' = '+R+' × '+h.naa)+' = '+fmt(perAtk(h,as,rr),2)+'</code> per attack. Each attack gives less rage the more bonus ATK SPD you have, down to a 30% floor, which is reached at 800 for almost every hero.</li>');
      li.push('<li>Rage per second: <code>'+fmt(passive(h),2)+' + '+fmt(1000/iv,3)+' attacks per second × '+fmt(perAtk(h,as,rr),2)+' = '+fmt(rg,2)+'</code>.</li>');
      if(isUlt) li.push('<li>Skill Cost at max ult level: <code>'+h.ma0.toLocaleString()+(h.ma!==h.ma0?' '+(h.ma-h.ma0>0?'+':'−')+' '+Math.abs(h.ma-h.ma0):'')+' = '+h.ma.toLocaleString()+'</code> rage, so <code>'+fmt(h.ma/rg,1)+' s</code> to fill'+(lock?', plus <code>'+fmt(lock,0)+' s</code> while the ultimate runs (rage resets to 0 at the cast; the hero\'s own regen is paused until it ends).':'. The cast resets rage to 0 and regen resumes immediately.')+' First cast: Initial Rage '+h.ir.toLocaleString()+', so <code>('+h.ma.toLocaleString()+' − '+h.ir.toLocaleString()+') ÷ '+fmt(rg,2)+' = '+fmt(firstUlt(h,as,rr),1)+' s</code> after deploy.</li>');
    }
    const c=[['BaseSpeed',h.bs],['MinSpeed',h.ms],['MaxAnger (base)',h.ma0],['Skill Cost change at max ult level',h.ma-h.ma0],['Initial Rage at max ult level',h.ir],['AngerRecovery',h.ar],['nAttackAnger',h.naa],['AttackAngerHedging',h.hg||'none'],['HitAngerRecovery',h.har],['ExtraUltimateCharges',h.xc]];
    if(h.ult) c.push(['Ultimate',h.ult.nm+(h.ult.lt.length?', '+(h.ult.lt[h.ult.lt.length-1]/1000)+' s at max level':'')]);
    $('how').innerHTML='<ol>'+li.join('')+'</ol><p>Rage Regen (Attacked), which is HitAngerRecovery × (1 + Rage Regen) per damaging hit taken, and rage from skills are not included. Constants for '+h.nm+' from the client data tables:</p><table>'+c.map(r=>'<tr><td>'+r[0]+'</td><td class="n">'+(typeof r[1]==='number'?r[1].toLocaleString():r[1])+'</td></tr>').join('')+'</table><p>Globals: hedging offset '+HEDGE_OFF+', floor '+HEDGE_MIN+'%, speed curve '+SP_NUM+' ÷ ('+SP_DEN+' + ATK SPD), '+FRAME+' ms per frame. Formulas were read from the game client\'s decompiled anger and attack-cooldown code. Data as of '+DATA.built+'.</p>';
  }

  sel.addEventListener('change',pick);
  sAs.addEventListener('input',render);
  vAs.addEventListener('input',()=>{if(vAs.value==='')return; sAs.value=Math.max(100,Math.min(XCAP,+vAs.value)); render();}); vAs.addEventListener('blur',()=>{vAs.value=sAs.value;});
  vRr.addEventListener('input',()=>{if(vRr.value==='')return; setRR(+vRr.value);}); vRr.addEventListener('blur',()=>{vRr.value=rr;});
  const openHow=/how=1/.test(location.hash), openPick=/pick=1/.test(location.hash); readHash(); pick();
  if(openHow) document.querySelector('details').open=true; if(openPick) openPop();
})();
</script>
</body></html>
